version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: MyTestServer
      POSTGRES_PASSWORD: Saurabh2000
      POSTGRES_DB: MyDatabase
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: ./docker/Dockerfile.backend
      target: production
    environment:
      DATABASE_URL: postgresql+asyncpg://MyTestServer:Saurabh2000@db:5432/MyDatabase
      DATABASE_URL_SYNC: postgresql://MyTestServer:Saurabh2000@db:5432/MyDatabase
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: 1c2bd015a8a5b9c735b44f4d9fca85288938fc278b1d8385c166356d7533f3125d28bf63aea0bd2740841034
      CORS_ORIGINS: '["https://${DOMAIN:-localhost}"]'
      UPLOAD_DIR: /tmp/uploads
      DETECTION_MODEL: ${DETECTION_MODEL:-haar}
    volumes:
      - upload_data:/tmp/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: ./docker/Dockerfile.frontend
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost/api/v1}
      NEXT_PUBLIC_WS_URL: ${WS_URL:-ws://localhost}
    depends_on:
      - backend
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "${PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: always

volumes:
  postgres_data:
  redis_data:
  upload_data:
